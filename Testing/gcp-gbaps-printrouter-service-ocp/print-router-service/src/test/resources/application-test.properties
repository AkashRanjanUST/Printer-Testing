# ============================================================
# TEST PROFILE - activated with @ActiveProfiles("test")
# All hosts use the reserved ".invalid" domain, which can never
# resolve, so no test can reach a real Costco system by accident.
# All credentials are fake.
# ============================================================

# --- Controller path: POST /api/v1/printroute/send ---
app.url.api.name=api

# --- Logging: console only; no log file written during tests ---
logging.file.name=
logging.level.root=WARN
logging.level.com.costco.replatform.foundation.printrouter=DEBUG

# --- Print server discovery (PrintServerDiscoveryService) ---
printrouter.target.url=http://print-server.test.invalid
printrouter.printer.path=/printers/TestPrinter/.printer
printrouter.printer.name=TestPrinter
printrouter.auth.username=TEST\\test-user
printrouter.auth.password=test-password
printrouter.auth.domain=TEST
printrouter.connection.timeout=1000
printrouter.connection.read-timeout=1000

# --- IPP printing (PrinterIppProperties / PrinterConnectivityService) ---
printer.ipp.queue-url=http://print-server.test.invalid:631/printers/TestPrinter
printer.ipp.requesting-user=test-user
printer.ipp.domain-username=TEST\\test-user
printer.ipp.password=test-password
printer.ipp.job-name=TEST_JOB_
printer.ipp.print-content=Unit test print content
printer.ipp.connect-timeout-seconds=1
printer.ipp.request-timeout-seconds=1

# --- Active Directory (ActiveDirectoryDiscoveryService) ---
# These @Value fields have NO defaults, so the context won't start without them.
jndi.ldap.host=ldap.test.invalid
jndi.ldap.port=:636
jndi.ldap.protocol=ldaps://
jndi.ldap.bind.user=test-bind-user@test.invalid
jndi.ldap.bind.password=test-bind-password
jndi.ldap.base.dn=DC=test,DC=invalid

# --- CORS / security placeholders (replace env-var placeholders) ---
app.cors.allowed-origins=http://localhost:3000
spring_security_user_name=test-actuator-user
spring_security_user_password=test-actuator-password