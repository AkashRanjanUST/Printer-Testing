
# ============================================================
# SPRING CONFIGURATION
# ============================================================
spring.application.name=printrouter-service

spring.profiles.active=local-vdi

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.url.api.name=api

# ============================================================
# ACTUATOR CONFIGURATION (for monitoring)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
# ============================================================
# LOGGING CONFIGURATION
# ============================================================
# Root logger level
logging.level.root=INFO

# Package-specific logger levels
logging.level.com.costco.iseries.replatform=DEBUG
logging.level.com.costco.iseries.replatform.foundation.printrouter=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO

# Log output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30


