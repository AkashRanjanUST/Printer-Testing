# ============================================================
# PRINTER SERVER CONFIGURATION
# ============================================================
# Target server URL for the printer
printrouter.target.url=http://wprgba01094t01.np.costco.com
# Printer path on the server
printrouter.printer.path=/printers/Laser1/.printer
# Friendly name of the printer
printrouter.printer.name=Laser1
# Username for NTLM authentication
printrouter.auth.username=NP\\${COSTCO_NP_USERNAME}
# Password for NTLM authentication
printrouter.auth.password=${COSTCO_NP_PWD}
# Authentication domain
printrouter.auth.domain=NP
# Connection timeout in milliseconds (5 seconds)
printrouter.connection.timeout=5000
# Read timeout in milliseconds (5 seconds)
printrouter.connection.read-timeout=5000

#============================================================
# IPP PRINTER CONFIGURATION
#============================================================
printer.ipp.queue-url=http://wprgba01094t01.np.costco.com/printers/
printer.ipp.requesting-user=${COSTCO_NP_USERNAME}
printer.ipp.domain-username=NP\\${COSTCO_NP_USERNAME}
printer.ipp.password=${COSTCO_NP_PWD}
printer.ipp.job-name=PRINT_JOB_
printer.ipp.print-content=Java IPP print test
printer.ipp.connect-timeout-seconds=10
printer.ipp.request-timeout-seconds=30

