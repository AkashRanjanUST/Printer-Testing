# ============================================================
# PRINTER SERVER CONFIGURATION
# ============================================================
# Target server URL for the printer eg:http://wprgba01094t01.np.costco.com
printrouter.target.url=${PRINT_SERVER_TARGET_URL}
# Printer path on the server eg:/printers/Laser1/.printer
printrouter.printer.path=${PRINTER_PATH_ON_PRINT_SERVER}
# Friendly name of the printer eg:Laser1
printrouter.printer.name=${PRINTER_NAME}
# Username for NTLM authentication eg:NP\\username
printrouter.auth.username=${COSTCO_DOMAIN_NAME}\\${COSTCO_NP_USERNAME}
# Password for NTLM authentication eg:pwd
printrouter.auth.password=${COSTCO_NP_PWD}
# Authentication domain eg:NP
printrouter.auth.domain=${COSTCO_DOMAIN_NAME}
# Connection timeout in milliseconds (5 seconds)
printrouter.connection.timeout=5000
# Read timeout in milliseconds (5 seconds)
printrouter.connection.read-timeout=5000

#============================================================
# IPP PRINTER CONFIGURATION
#============================================================
# eg:http://10.20.70.68:631/printers/Laser1
printer.ipp.queue-url=${PRINTER_URL}
printer.ipp.requesting-user=${COSTCO_NP_USERNAME}
printer.ipp.domain-username=NP\\${COSTCO_NP_USERNAME}
printer.ipp.password=${COSTCO_NP_PWD}
printer.ipp.job-name=Foundation_Print_test
printer.ipp.print-content=Foundation Print Test
printer.ipp.connect-timeout-seconds=10
printer.ipp.request-timeout-seconds=30

#============================================================
#SPRING SECURITY
#============================================================
app.cors.allowed-origins=https://ref-app.erp.np.cc-costco.com,http://localhost:3004,https://localhost:3001,http://localhost:3001

spring_security_user_name=${ACTUATOR_USERNAME}
spring_security_user_password=${ACTUATOR_PASSWORD}

#=============================================================
#LDAP
#=============================================================
jndi.ldap.host=
jndi.ldap.port=
jndi.ldap.protocol=
jndi.ldap.bind.user=
jndi.ldap.bind.password=
jndi.ldap.base.dn=